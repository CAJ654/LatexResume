name: Deploy LaTeX to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'main.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'PDF file path to upload'
        required: true
        default: 'main.pdf'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages artifact directory
        run: |
          # Read the workflow_dispatch input if present; fall back to main.pdf
          PDF_PATH="${{ github.event.inputs.pdf_path }}"
          PDF_PATH="${PDF_PATH:-main.pdf}"
          echo "Preparing artifact from: $PDF_PATH"
          mkdir -p pages-artifact
          if [ -f "$PDF_PATH" ]; then
            cp "$PDF_PATH" pages-artifact/
            echo "Copied $PDF_PATH -> pages-artifact/"
            ls -la pages-artifact
          else
            echo "::error::PDF not found at $PDF_PATH"
            ls -la
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
