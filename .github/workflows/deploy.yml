name: Deploy LaTeX to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'main.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'PDF file path to upload'
        required: true
        default: 'main.pdf'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.event.inputs.pdf_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
